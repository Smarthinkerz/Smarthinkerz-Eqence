# api.eqence.com -> eqence-api on 127.0.0.1:4410. certbot adds the 443 server block.
# Own file; no other site's config is touched.
server {
    listen 80;
    listen [::]:80;
    server_name api.eqence.com;

    client_max_body_size 5m;

    # Merchant uploads stored on the ECS disk (FILE_STORE=disk).
    location /files/ {
        alias /var/lib/eqence/files/;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'" always;
    }

    # The blog writer can take a few minutes for a long post; only this admin route waits longer.
    location = /api/v1/admin/blog-ai {
        proxy_pass http://127.0.0.1:4410;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:4410;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The API trusts X-Real-IP only; it is set here from the TCP peer, never passed through.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
